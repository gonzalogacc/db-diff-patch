[project]
name = "db-differ"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg2-binary>=2.9.12",
    "pytest-postgresql>=8.1.0",
    "sqlalchemy>=2.0.51",
    "sqlalchemy-utils>=0.42.1",
]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.pyright]
include = ["src", "tests"]
exclude = []
