[project]
name = "db-differ"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "google-api-python-client>=2.154.0",
    "google-auth>=2.37.0",
    "networkx>=3.6.1",
    "psycopg2-binary>=2.9.12",
    "pytest-postgresql>=8.1.0",
    "sqlalchemy>=2.0.51",
    "sqlalchemy-utils>=0.42.1",
]

[project.scripts]
db-differ = "src.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
]

[tool.pytest.ini_options]
pythonpath = [
  "."
]

[tool.pyright]
include = ["src", "tests"]
exclude = []
