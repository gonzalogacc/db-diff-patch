name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        run: make test

      - name: Update coverage badge
        run: |
          PCT=$(uv run coverage report --format=total)
          if [ "${PCT}" -ge 90 ]; then COLOR=brightgreen
          elif [ "${PCT}" -ge 75 ]; then COLOR=yellow
          else COLOR=red
          fi
          sed -i -E "s#coverage-[0-9]+%25-[a-z]+#coverage-${PCT}%25-${COLOR}#" README.md

      - name: Commit coverage badge
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update coverage badge"
          file_pattern: README.md
